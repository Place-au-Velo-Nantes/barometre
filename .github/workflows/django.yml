name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # Ubuntu 22.04 LTS (production) uses python 3.10.
        # Test for future compatibility.
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip uninstall anyjson
        pip install -r requirements.txt
    - name: Create Config File
      run: |
        cp barometre/settings_local_template.py barometre/settings_local.py
        sed 's/your-secret-here/django.core.management.utils.get_random_secret_key()/g' barometre/settings_local.py
    - name: Create Log File
      run: |
        mkdir -p /tmp/barometre-log/
        touch /tmp/barometre-log/barometre.log
    - name: Run Tests & Coverage
      run: |
        coverage run --source='.' manage.py test
        coverage report
    - name: Remove Config File
      run: |
        rm barometre/settings_local.py
    - name: Remove Log File
      run: |
        rm /tmp/barometre-log/barometre.log
